[package]
name = "bevy_ragnarok_spr"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[features]
# Graphical debugging of meshes
debug = []

[dependencies]
bevy_ragnarok_pal = { workspace = true }
ragnarok_spr = { workspace = true }
ragnarok_rebuild_common = { path = "../../ragnarok_rebuild_common" }

bevy_app = { workspace = true, default-features = false }
bevy_asset = { workspace = true, default-features = false }
bevy_color = { workspace = true, default-features = false }
bevy_ecs = { workspace = true, default-features = false }
bevy_image = { workspace = true, default-features = false }
bevy_math = { workspace = true, default-features = false }
bevy_mesh = { workspace = true, default-features = false }
bevy_pbr = { workspace = true, default-features = false }
bevy_reflect = { workspace = true, default-features = false }
bevy_render = { workspace = true, default-features = false }
bevy_shader = { workspace = true, default-features = false }

[dev-dependencies]
bevy = { workspace = true, features = [
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_render",
    "bevy_window",
    "bevy_winit",
    "debug",
    "tonemapping_luts",
    "wayland",
    "zstd_rust",
] }
